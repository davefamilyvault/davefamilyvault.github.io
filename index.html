'use strict';
/* ============================================================
   Sync between devices through the family Google account.
   Everything is encrypted on the device (AES-256-GCM, key from the family passphrase via PBKDF2)
   before upload. Files live in Drive's hidden app folder, which only this app can read.
   Each device uploads its own change files; others download and merge them (newest edit wins).
   ============================================================ */
const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const API = 'https://www.googleapis.com/drive/v3';
const UPLOAD = 'https://www.googleapis.com/upload/drive/v3';
const PBKDF2_ITER = 600000;
const CHUNK_BYTES = 3.5 * 1024 * 1024;
const b64 = { enc: u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
  dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };

const SYNC = {
  status: 'off', lastSync: null, error: null, token: null, tokenExp: 0, key: null, busy: false, tokenClient: null, _pushTimer: null,
  config() {
    const c = window.FH_CONFIG || {};
    return { clientId: S.getMeta('syncClientId') || c.googleClientId || '', email: S.getMeta('syncEmail') || c.familyEmail || '' };
  },
  available() { return !!this.config().clientId && (location.protocol === 'https:' || location.hostname === 'localhost') && !/claude|anthropic/.test(location.hostname); },
  enabled() { return !!S.getMeta('syncOn') && !!this.key; },
  async init() {
    this.key = S.getMeta('syncKey');
    this.lastSync = S.getMeta('syncLast');
    try { const t = JSON.parse(localStorage.getItem('fh-token') || 'null'); if (t && t.exp > Date.now() + 60000) { this.token = t.token; this.tokenExp = t.exp; } } catch (e) {}
    if (!this.enabled()) { this.status = 'off'; return; }
    this.status = this.token ? 'ok' : 'needs-auth';
    if (!this._wired) {
      this._wired = true;
      window.addEventListener('online', () => this.auto());
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.auto(60000); });
      setInterval(() => { if (document.visibilityState === 'visible') this.auto(); }, 5 * 60000);
    }
    if (this.token) this.syncNow().catch(() => {});
  },
  auto(minGap = 0) { if (!this.enabled() || !this.token || this.busy) return; if (minGap && this.lastSync && Date.now() - new Date(this.lastSync).getTime() < minGap) return; this.syncNow().catch(() => {}); },

  /* ---------- change tracking ---------- */
  pending() { return S.getMeta('syncPending', []); },
  async markDirty(store, recs) {
    if (!S.getMeta('syncOn')) return;
    const set = new Set(this.pending()); recs.forEach(r => set.add(store + '|' + r.id));
    await S.setMeta('syncPending', [...set]);
    clearTimeout(this._pushTimer);
    this._pushTimer = setTimeout(() => { if (this.token) this.syncNow().catch(() => {}); else this.setStatus('needs-auth'); }, 2500);
    refreshSyncPill();
  },

  /* ---------- Google sign-in (token model) ---------- */
  loadGis() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => res(); s.onerror = () => rej(new Error('Could not reach Google. Check the internet connection.')); document.head.appendChild(s); });
  },
  async signIn(interactive = true) {
    await this.loadGis();
    const { clientId, email } = this.config();
    return new Promise((res, rej) => {
      const client = google.accounts.oauth2.initTokenClient({ client_id: clientId, scope: SCOPE, hint: email || undefined,
        callback: r => { if (r.error) return rej(new Error(r.error_description || r.error)); this.token = r.access_token; this.tokenExp = Date.now() + (r.expires_in || 3600) * 1000;
          try { localStorage.setItem('fh-token', JSON.stringify({ token: this.token, exp: this.tokenExp })); } catch (e) {} res(this.token); },
        error_callback: e => rej(new Error(e && e.type === 'popup_closed' ? 'Sign-in window was closed.' : 'Sign-in did not complete.')) });
      client.requestAccessToken({ prompt: interactive ? '' : 'none' });
    });
  },
  dropToken() { this.token = null; this.tokenExp = 0; try { localStorage.removeItem('fh-token'); } catch (e) {} },

  /* ---------- Drive calls ---------- */
  async api(url, opts = {}) {
    if (!this.token || Date.now() > this.tokenExp - 30000) { this.dropToken(); throw Object.assign(new Error('auth'), { auth: true }); }
    const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + this.token } });
    if (r.status === 401 || r.status === 403 && /insufficient|authError/i.test(await r.clone().text())) { this.dropToken(); throw Object.assign(new Error('auth'), { auth: true }); }
    if (!r.ok) throw new Error(`Google Drive replied ${r.status}. Try again in a minute.`);
    return r;
  },
  async list(q) {
    let files = [], pageToken = '';
    do {
      const u = `${API}/files?spaces=appDataFolder&pageSize=1000&orderBy=createdTime&fields=nextPageToken,files(id,name,size,createdTime)&q=${encodeURIComponent(q)}${pageToken ? '&pageToken=' + pageToken : ''}`;
      const j = await (await this.api(u)).json(); files = files.concat(j.files || []); pageToken = j.nextPageToken || '';
    } while (pageToken);
    return files;
  },
  async upload(name, bytes, mime = 'application/octet-stream') {
    const boundary = 'fh' + uid().replace(/-/g, '');
    const meta = JSON.stringify({ name, parents: ['appDataFolder'] });
    const body = new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: ${mime}\r\n\r\n`, bytes, `\r\n--${boundary}--`]);
    const r = await this.api(`${UPLOAD}/files?uploadType=multipart&fields=id,name,createdTime`, { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body });
    return r.json();
  },
  async download(id) { return new Uint8Array(await (await this.api(`${API}/files/${id}?alt=media`)).arrayBuffer()); },

  /* ---------- encryption ---------- */
  async deriveKey(pass, salt) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: PBKDF2_ITER }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async seal(key, text) {
    let data = new TextEncoder().encode(text); let magic = 'FHC1';
    if (window.CompressionStream) { data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); magic = 'FHZ1'; }
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data));
    const out = new Uint8Array(4 + 12 + ct.length); out.set(new TextEncoder().encode(magic)); out.set(iv, 4); out.set(ct, 16); return out;
  },
  async open(key, bytes) {
    const magic = new TextDecoder().decode(bytes.subarray(0, 4));
    if (magic !== 'FHC1' && magic !== 'FHZ1') throw new Error('Unknown file format');
    let data = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(4, 16) }, key, bytes.subarray(16)));
    if (magic === 'FHZ1') data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
    return new TextDecoder().decode(data);
  },

  /* ---------- vault (the shared, encrypted space) ---------- */
  async findVault() {
    const v = await this.list("name = 'vault.json'");
    if (!v.length) return null;
    return { file: v[0], data: JSON.parse(new TextDecoder().decode(await this.download(v[0].id))) };
  },
  async createVault(pass) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await this.deriveKey(pass, salt);
    const check = await this.seal(key, 'family-health-key-check');
    const vault = { format: 'family-health-vault', v: 1, kdf: 'PBKDF2-SHA256', iterations: PBKDF2_ITER, salt: b64.enc(salt), check: b64.enc(check), createdAt: nowIso(), createdBy: S.deviceId };
    await this.upload('vault.json', new TextEncoder().encode(JSON.stringify(vault)), 'application/json');
    return key;
  },
  async unlock(vault, pass) {
    const key = await this.deriveKey(pass, b64.dec(vault.salt));
    try { if (await this.open(key, b64.dec(vault.check)) !== 'family-health-key-check') throw 0; } catch (e) { return null; }
    return key;
  },

  /* ---------- push and pull ---------- */
  async push(all = false) {
    const keys = all ? COLLECTIONS.flatMap(c => [...S[c].keys()].map(id => c + '|' + id)) : this.pending();
    if (!keys.length) return 0;
    const recs = keys.map(k => { const [c, id] = k.split('|'); const r = S[c] && S[c].get(id); return r ? { c, r } : null; }).filter(Boolean);
    const chunks = []; let cur = [], size = 0;
    for (const x of recs) { const n = JSON.stringify(x).length; if (cur.length && size + n > CHUNK_BYTES) { chunks.push(cur); cur = []; size = 0; } cur.push(x); size += n; }
    if (cur.length) chunks.push(cur);
    const applied = new Set(S.getMeta('syncApplied', []));
    for (const ch of chunks) {
      const bytes = await this.seal(this.key, JSON.stringify({ v: 1, device: S.deviceId, createdAt: nowIso(), records: ch }));
      const f = await this.upload(`chg-${S.deviceId.slice(0, 8)}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}.fhc`, bytes);
      applied.add(f.id);
    }
    await S.setMeta('syncApplied', [...applied]);
    const left = new Set(S.getMeta('syncPending', [])); keys.forEach(k => left.delete(k)); await S.setMeta('syncPending', [...left]);
    return recs.length;
  },
  async pull(remoteSeen) {
    const files = await this.list("name contains 'chg-'");
    const applied = new Set(S.getMeta('syncApplied', []));
    let changed = 0;
    for (const f of files) {
      if (applied.has(f.id)) continue;
      let payload;
      try { payload = JSON.parse(await this.open(this.key, await this.download(f.id))); }
      catch (e) { applied.add(f.id); continue; }                           // unreadable file: skip it, never block syncing
      const byStore = {};
      for (const { c, r } of payload.records || []) {
        if (!COLLECTIONS.includes(c) || !r || !r.id) continue;
        if (remoteSeen) { const k = c + '|' + r.id; if (!remoteSeen.has(k) || (r.updatedAt || '') > remoteSeen.get(k)) remoteSeen.set(k, r.updatedAt || ''); }
        const cur = S[c].get(r.id);
        if (!cur || (r.updatedAt || '') > (cur.updatedAt || '') || ((r.updatedAt || '') === (cur.updatedAt || '') && (r.updatedBy || '') > (cur.updatedBy || ''))) {
          (byStore[c] = byStore[c] || []).push(r);
        }
      }
      for (const [c, rs] of Object.entries(byStore)) { await idb.put(c, rs); rs.forEach(r => S[c].set(r.id, r)); changed += rs.length; }
      applied.add(f.id);
      await S.setMeta('syncApplied', [...applied]);
    }
    if (changed) { S.reindex(); indexTests(); }
    return changed;
  },
  async syncNow() {
    if (this.busy) return; this.busy = true; this.setStatus('syncing');
    try {
      const got = await this.pull(); const sent = await this.push();
      this.lastSync = nowIso(); await S.setMeta('syncLast', this.lastSync); this.error = null; this.setStatus('ok');
      if (got && !document.querySelector('form')) router();
      return { got, sent };
    } catch (e) {
      if (e.auth) this.setStatus('needs-auth'); else { this.error = e.message; this.setStatus('error'); }
      throw e;
    } finally { this.busy = false; refreshSyncPill(); }
  },
  async tapToSync() {
    try { if (!this.token) await this.signIn(true); await this.syncNow(); toast('Synced'); }
    catch (e) { if (!e.auth) toast(e.message || 'Sync did not complete'); }
  },
  setStatus(s) { this.status = s; refreshSyncPill(); },
  async disconnect() {
    await S.setMeta('syncOn', false); await S.setMeta('syncKey', null); await S.setMeta('syncApplied', []); await S.setMeta('syncPending', []);
    this.key = null; this.dropToken(); this.status = 'off';
  },
};

/* ---------- status pill ---------- */
function ago(iso) {
  if (!iso) return 'not yet';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return `${Math.round(s / 60)} min ago`; if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return fmtDate(iso.slice(0, 10));
}
function syncPillHtml() {
  if (!S.getMeta('syncOn')) return '';
  const n = SYNC.pending().length; const st = SYNC.status;
  const map = { syncing: ['c-ok', 'Syncing…'], ok: ['c-ok', n ? `${n} change${n > 1 ? 's' : ''} waiting` : `Synced ${ago(SYNC.lastSync)}`],
    'needs-auth': ['c-warn', n ? `Tap to sync (${n} change${n > 1 ? 's' : ''})` : 'Tap to sync'], error: ['c-bad', 'Sync failed. Tap to retry'], off: ['', ''] };
  const [cls, txt] = map[st] || map.ok;
  return `<button class="syncpill ${cls}" data-sync title="Sync with the family's other devices">${icon(st === 'syncing' ? 'refresh' : 'cloud', st === 'syncing' ? 'spin' : '')}<span>${esc(txt)}</span></button>`;
}
function refreshSyncPill() { $$('.syncpill-slot').forEach(el => { el.innerHTML = syncPillHtml(); }); }
document.addEventListener('click', e => { if (e.target.closest('[data-sync]')) SYNC.tapToSync(); });

  };
}

'use strict';

   {s, x, y, w, h, conf?}, where y is the text baseline, in the same units

const RD = {};

RD.LAB_ALIASES = {
  tc: ['cholesterol', 'total cholesterol', 'serum cholesterol', 'cholesterol total', 's cholesterol', 'cholesterol serum'],

  $('#rd-keep').onchange = e => { st.keepDoc = e.target.checked; };
  $$('[data-mode]').forEach(b => b.onclick = () => { st.mode = b.dataset.mode; redraw(); });
  const pb = $('[data-pages]'); if (pb) pb.onclick = () => openDocument({ title: st.file.name, kind: 'Lab report', note: '', date: st.date, pages: st.pages.map(p => pageJpeg(p.canvas)), _preview: true }, null);
  $$('.rrow').forEach(el => {
    const r = st.rows[+el.dataset.i];
    $('[data-f=include]', el).onchange = e => { r.include = e.target.checked; redraw(); };
    $('[data-f=input]', el).onchange = e => { r.input = e.target.value.trim(); redraw(); };
    $('[data-f=test]', el).onchange = async e => {
      let id = e.target.value;
      if (id === '__new') { const t = await newTestDialog(r.name); if (!t) { redraw(); return; } id = t.id; }
      r.testId = id || null; r.sure = true; r.userMapped = !!id && !r.manual; r.calc = !!(id && S.test(id).calculated); r.include = !!id && !r.calc; redraw();
    };
  });
  $('#rd-addrow').onclick = () => { st.rows.push({ name: '', manual: true, testId: null, sure: true, value: null, text: null, unit: '', range: '', conf: null, include: false, calc: false, snip: null, input: '', page: 0 }); redraw();
    const last = $$('.rrow').pop(); if (last) { last.scrollIntoView({ block: 'center' }); $('[data-f=test]', last).focus(); } };
  $('#rd-save').onclick = () => saveRead(st);
}
async function saveRead(st) {
  const err = $('#rd-err'); err.textContent = '';
  if (!st.memberId) { err.textContent = 'Choose the person this report belongs to.'; return; }
  if (!st.date) { err.textContent = 'Enter the date of the sample.'; return; }
  const rows = st.rows.filter(r => r.include && r.testId);
  if (!rows.length) { err.textContent = 'Tick at least one value to save.'; return; }
  const out = [];
  for (const r of rows) {
    const t = S.test(r.testId);
    if (t.type === 'text') { out.push({ r, testId: t.id, value: null, text: r.input }); continue; }
    const raw = String(r.input).replace(/,/g, '').trim(); const q = /^[<>]=?/.exec(raw); const v = parseFloat(raw.replace(/^[<>]=?\s*/, ''));
    if (isNaN(v)) { err.textContent = `${t.name}: enter a number.`; return; }
    out.push({ r, testId: t.id, value: v, text: q ? raw : null, qualifier: q ? q[0] : null });
  }
  const ex = st.mode === 'merge' ? existingReportFor(st) : null;
  const rep = ex ? { ...ex } : { id: uid(), createdAt: nowIso(), notes: [], source: [] };
  Object.assign(rep, { memberId: st.memberId, date: st.date, time: rep.time || st.time || null, lab: rep.lab || st.lab || null });
  rep.source = [...new Set([...(rep.source || []), `PDF ${st.file.name}`])];
  await S.save('reports', rep);
  const existing = ex ? S.resultsOf(ex) : [];
  const recs = [];
  for (const o of out) {
    const cur = existing.find(x => x.testId === o.testId);
    const base = { value: o.value, text: o.text, qualifier: o.qualifier || null, unit: S.test(o.testId).unit || null, calculated: false,
      labRange: o.r.range || null, labUnit: o.r.unit || null, source: st.ocr ? 'photo (OCR)' : 'lab PDF', origin: 'reader', originalValue: o.r.value !== null && o.r.value !== undefined ? String(o.r.value) : o.r.text };
    if (cur) {
      const same = (cur.value === o.value && (cur.text || null) === (o.text || null));
      if (!same) recs.push({ ...cur, ...base, replaced: { value: cur.value, text: cur.text || null, calculated: !!cur.calculated, at: nowIso() } });
    } else recs.push({ id: uid(), reportId: rep.id, memberId: st.memberId, testId: o.testId, ...base });
  }
  if (recs.length) await S.save('results', recs);
  // remember names the user matched by hand, so the next report from this lab is recognised
  const learned = [];
  for (const r of st.rows) if (r.userMapped && r.testId) { const t = S.test(r.testId); if (!(t.aliases || []).some(a => RD.norm(a) === RD.norm(r.name))) learned.push({ ...t, aliases: [...(t.aliases || []), r.name] }); }
  if (learned.length) { for (const t of learned) delete t._order; await S.save('tests', learned); indexTests(); }
  if (st.keepDoc) {
    await S.save('documents', { id: uid(), memberId: st.memberId, reportId: rep.id, date: st.date, title: `Lab report${st.lab ? ', ' + st.lab : ''}`, kind: 'Lab report',
      note: st.file.name, source: st.ocr ? 'photo (OCR)' : 'lab PDF', pages: st.pages.map((p, i) => ({ fileName: `page-${i + 1}.jpg`, ...pageJpeg(p.canvas) })) });
  }
  READ.state = null;
  toast(ex ? `Added to the report of ${fmtDate(st.date)}: ${recs.length} value${recs.length === 1 ? '' : 's'} updated` : `Report saved with ${recs.length} values`);
  location.hash = '#/r/' + rep.id;
}

'use strict';
const prefs = {
  get(k, d) { try { const v = localStorage.getItem('fh-' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fh-' + k, v); } catch (e) {} },
};
function applyPrefs() {
  const t = prefs.get('theme', 'auto'), s = prefs.get('size', 'normal');
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  if (s === 'large') document.documentElement.setAttribute('data-size', 'large'); else document.documentElement.removeAttribute('data-size');
}
function indexTests() { S.live('tests').forEach((t, i) => { if (t._order === undefined) t._order = i; }); }

function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?'); const q = new URLSearchParams(qs || ''); const p = path.split('/').filter(Boolean).map(decodeURIComponent);
  if (S.isEmpty() && !(p[0] === 'person' && p[1] === 'new')) return { name: 'welcome', title: 'Welcome' };
  if (p[0] !== 'read' && READ.state && READ.state.stage === 'busy') READ.state = null;
  if (!p.length) return { name: 'home', title: 'Family health' };
  if (p[0] === 'p') {
    const m = S.member(p[1]); if (!m) return { name: 'home', title: 'Family health' };
    if (p[2] === 'test' && S.test(p[3])) return { name: 'trend', member: m, testId: p[3], title: S.test(p[3]).name, back: `#/p/${m.key}` };
    return { name: 'person', member: m, tab: ['overview', 'reports', 'table', 'medicines', 'history'].includes(p[2]) ? p[2] : 'overview', title: m.name, back: '#/' };
  }
  if (p[0] === 'r') { const r = S.reports.get(p[1]); if (r && !r.deleted) { const m = S.members.get(r.memberId); return { name: 'report', report: r, member: m, title: fmtDate(r.date), back: `#/p/${m.key}/reports` }; } }
  if (p[0] === 'add') { const m = S.member(q.get('p') || ''); return { name: 'editor', member: m, title: 'Add a report', back: m ? `#/p/${m.key}` : '#/' }; }
  if (p[0] === 'edit') { const r = S.reports.get(p[1]); if (r) return { name: 'editor', report: r, member: S.members.get(r.memberId), title: 'Edit report', back: `#/r/${r.id}` }; }
  if (p[0] === 'person') { if (p[1] === 'new') return { name: 'personEdit', title: 'Add a person', back: '#/' };
    const m = S.member(p[1]); if (m) return { name: 'personEdit', member: m, title: 'Edit details', back: `#/p/${m.key}` }; }
  if (p[0] === 'med') { if (p[1] === 'new') { const m = S.member(q.get('p') || ''); if (m) return { name: 'medEdit', member: m, title: 'Medicines', back: `#/p/${m.key}/medicines` }; }
    else if (S.live('medicines').some(x => x.listId === p[1])) { const m = S.members.get(S.live('medicines').find(x => x.listId === p[1]).memberId); return { name: 'medEdit', listId: p[1], member: m, title: 'Medicines', back: `#/p/${m.key}/medicines` }; } }
  if (p[0] === 'event') { if (p[1] === 'new') { const m = S.member(q.get('p') || ''); if (m) return { name: 'eventEdit', member: m, title: 'Event', back: `#/p/${m.key}/history` }; }
    else { const e = S.events.get(p[1]); if (e) { const m = S.members.get(e.memberId); return { name: 'eventEdit', event: e, member: m, title: 'Event', back: `#/p/${m.key}/history` }; } } }
  if (p[0] === 'read') { const m = S.member(q.get('p') || ''); return { name: 'read', member: m, shared: q.has('shared'), title: 'Read a lab report', back: m ? `#/p/${m.key}` : '#/' }; }
  if (p[0] === 'data') return { name: 'data', title: 'Backup and export', back: '#/' };
  if (p[0] === 'settings') return { name: 'settings', title: 'Settings', back: '#/' };
  if (p[0] === 'welcome') return { name: 'welcome', title: 'Welcome' };
  return { name: 'home', title: 'Family health' };
}

let lastRouteKey = '';
function router() {
  const route = parseRoute();
  const main = $('#main');
  document.body.classList.toggle('bare', route.name === 'welcome');
  $('#app').classList.toggle('no-rail', route.name === 'welcome');
  renderShell(route);
  let html = '';
  switch (route.name) {
    case 'welcome': html = viewWelcome(); break;
    case 'home': html = viewHome(); break;
    case 'person': html = viewPerson(route.member, route.tab); break;
    case 'report': html = viewReport(route.report); break;
    case 'trend': html = viewTrend(route.member, route.testId); break;
    case 'editor': html = viewEditor(route); break;
    case 'personEdit': html = viewPersonEdit(route.member); break;
    case 'medEdit': html = viewMedEdit(route); break;
    case 'eventEdit': html = viewEventEdit(route); break;
    case 'read': html = viewRead(route); break;
    case 'data': html = viewData(); break;
    case 'settings': html = viewSettings(); break;
  }
  main.innerHTML = html;
  document.title = (route.title ? route.title + ' | ' : '') + 'Family health';
  const key = location.hash;
  if (key !== lastRouteKey) { window.scrollTo(0, 0); lastRouteKey = key; const h1 = $('h1', main); if (h1) { h1.setAttribute('tabindex', '-1'); } }
  // per-view wiring
  if (route.name === 'welcome') afterWelcome();
  if (route.name === 'home') { const hs = $('[data-hide-sync]'); if (hs) hs.onclick = async () => { await S.setMeta('syncHintHidden', true); router(); }; }
  if (route.name === 'person' && route.tab === 'overview' && S.reportsOf(route.member).length) afterPersonOverview(route.member);
  if (route.name === 'person' && route.tab === 'table') $$('[data-order]').forEach(b => b.onclick = async () => { await S.setMeta('tableNewestFirst', b.dataset.order === '1'); router(); });
  if (route.name === 'person' && route.tab === 'history') {
    $$('[data-doc]').forEach(b => b.onclick = () => openDocument(S.documents.get(b.dataset.doc), route.member));
    const up = $('#doc-add'); if (up) up.onchange = e => addImages(route.member, [...e.target.files]);
  }
  if (route.name === 'trend') {
    const draw = () => { const el = $('#chart'); if (!el) return; const pts = seriesOf(route.member, route.testId).filter(p => typeof p.value === 'number' && (S.getMeta('trendPeriod', 'all') === 'all' || yearsAgo(p.date) <= +S.getMeta('trendPeriod', 'all')));
      trendChart(el, { points: pts, member: route.member, testId: route.testId, onPick: p => { location.hash = '#/r/' + p.report.id; } }); };
    draw(); window.__redraw = debounce(draw, 150);
    $$('[data-period]').forEach(b => b.onclick = async () => { await S.setMeta('trendPeriod', b.dataset.period); router(); });
  } else window.__redraw = null;
  if (route.name === 'report') $$('[data-doc]').forEach(b => b.onclick = () => openDocument(S.documents.get(b.dataset.doc), route.member));
  if (route.name === 'report') { const d = $('[data-del]'); if (d) d.onclick = async () => {
    if (!await confirmDialog({ title: 'Delete this report?', body: `The report of ${fmtDate(route.report.date)} and its ${S.resultsOf(route.report).length} values will be removed.`, ok: 'Delete report', danger: true })) return;
    const m = S.members.get(route.report.memberId); await S.remove('results', S.resultsOf(route.report)); await S.remove('reports', route.report); toast('Report deleted'); location.hash = `#/p/${m.key}/reports`; }; }
  if (route.name === 'editor') afterEditor(route);
  if (route.name === 'personEdit') afterPersonEdit(route.member);
  if (route.name === 'medEdit') afterMedEdit(route);
  if (route.name === 'eventEdit') afterEventEdit(route);
  if (route.name === 'data') afterData();
  if (route.name === 'read') afterRead(route);
  if (route.name === 'settings') afterSettings();
}
async function shrinkImage(file, maxSide = 2000) {
  // phone photos are large; keep documents readable but small so they sync quickly
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/jpeg', 0.82);
    const b = dataUrl.split(',')[1];
    return { fileName: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', bytes: Math.round(b.length * 0.75), dataBase64: b };
  } finally { URL.revokeObjectURL(url); }
}
async function addImages(m, files) {
  const imgs = files.filter(f => f.type.startsWith('image/')); if (!imgs.length) return;
  const pages = [];
  for (const f of imgs) { try { pages.push(await shrinkImage(f)); } catch (e) { toast(`${f.name} could not be read as an image`); } }
  if (!pages.length) return;
  const title = imgs.length === 1 ? imgs[0].name.replace(/\.[^.]+$/, '') : `${imgs.length} images`;
  await S.save('documents', { id: uid(), memberId: m.id, date: todayIso(), title, kind: 'Image', pages, note: null, source: 'added in the app' });
  toast('Document added'); router();
}

async function start() {
  applyPrefs();
  try { await idb.open(); await S.load(); indexTests(); await SYNC.init(); }
  catch (e) { $('#main').innerHTML = `<div class="page"><div class="panel pad"><h2>This browser is blocking storage</h2><p class="muted" style="margin-top:8px">The app keeps your records in this browser's storage, which is turned off here (private browsing can do this). Open the app in a normal window.</p></div></div>`; return; }
  window.addEventListener('hashchange', router);
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installPrompt = e; if (location.hash.includes('settings')) router(); });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/claude|anthropic/.test(location.hostname) && window.top === window) {
    const hadController = !!navigator.serviceWorker.controller; let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading || document.querySelector('form') || (typeof READ !== 'undefined' && READ.state)) return;
      reloading = true; location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  window.addEventListener('resize', () => window.__redraw && window.__redraw());

start();

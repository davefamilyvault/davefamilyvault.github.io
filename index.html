:root {
  --paper: #F3F6F5; --surface: #FFFFFF; --surface-2: #EDF2F0; --ink: #17252F; --ink-2: #4B5C66; --ink-3: #74848C;
  --line: #D9E2DF; --line-2: #C3CFCB;
  --primary: #23408E; --primary-ink: #FFFFFF; --primary-soft: #E6EBF7;
  --band: #D5EDE2; --band-line: #9BCDB6;
  --ok: #1D7654; --ok-soft: #E1F2EA; --warn: #A86300; --warn-soft: #FBEEDA; --bad: #BE3A34; --bad-soft: #FBE5E3;
  --target: #7B47B8;
  --focus: #2E6BE6; --shadow: 0 1px 2px rgba(23,37,47,.06), 0 8px 24px rgba(23,37,47,.06);
  --radius-lg: 18px; --radius: 12px; --radius-sm: 8px;
  --font: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1719; --surface: #162124; --surface-2: #1C2A2E; --ink: #E4ECEA; --ink-2: #A9B8B6; --ink-3: #7F8F8E;
    --line: #26363A; --line-2: #34474C; --primary: #8FA8F0; --primary-ink: #0F1719; --primary-soft: #1F2A45;
    --band: #1C3A2F; --band-line: #2E6A52; --ok: #5CC99A; --ok-soft: #173327; --warn: #E6A64B; --warn-soft: #382A14;
    --bad: #F0837D; --bad-soft: #3D1E1C; --target: #B993F0; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1719; --surface: #162124; --surface-2: #1C2A2E; --ink: #E4ECEA; --ink-2: #A9B8B6; --ink-3: #7F8F8E;
  --line: #26363A; --line-2: #34474C; --primary: #8FA8F0; --primary-ink: #0F1719; --primary-soft: #1F2A45;
  --band: #1C3A2F; --band-line: #2E6A52; --ok: #5CC99A; --ok-soft: #173327; --warn: #E6A64B; --warn-soft: #382A14;
  --bad: #F0837D; --bad-soft: #3D1E1C; --target: #B993F0; --shadow: none; color-scheme: dark;
}
:root[data-size="large"] { font-size: 112.5%; }

* { box-sizing: border-box; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 1rem; line-height: 1.5;
  font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 2rem; font-weight: 750; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: .875rem; }

/* ---------- shell */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface);
  padding: calc(20px + env(safe-area-inset-top, 0px)) 14px 20px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 750; font-size: 1.1rem; text-decoration: none; color: var(--ink); }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--primary); display: grid; place-items: center; color: var(--primary-ink); }
.rail-label { font-size: .8rem; color: var(--ink-3); padding: 0 10px; margin-bottom: 4px; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail-link { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px; text-decoration: none; color: var(--ink); }
.rail-link:hover { background: var(--surface-2); }
.rail-link[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.rail-link .sub { display: block; font-size: .78rem; color: var(--ink-3); font-weight: 400; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
main { min-width: 0; padding: 28px 36px 64px; }
.page { max-width: 1120px; margin: 0 auto; }
.topbar, .bottombar { display: none; }

@media (max-width: 899px) {
  .shell { grid-template-columns: 1fr; }
  .rail { display: none; }
  main { padding: 16px 16px 96px; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 20; align-items: center; gap: 8px; min-height: 56px;
    padding: env(safe-area-inset-top, 0px) 10px 0; top: 0; background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .topbar .title { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bottombar { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .bottombar a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; text-decoration: none;
    color: var(--ink-2); padding: 6px 0; border-radius: 10px; }
  .bottombar a[aria-current="page"] { color: var(--primary); font-weight: 700; }
  .bottombar a.add { color: var(--primary); }
  .bottombar a.add .icon-wrap { background: var(--primary); color: var(--primary-ink); border-radius: 12px; padding: 4px 16px; }
  h1 { font-size: 1.65rem; }
}

/* ---------- buttons, inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px;
  border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer;
  font-weight: 650; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: .9rem; border-radius: 9px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 42px; height: 42px; border-radius: 11px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.icon-btn:hover { background: var(--surface-2); }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: .875rem; font-weight: 650; color: var(--ink-2); }
.input, select.input, textarea.input { width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 10px;
  background: var(--surface); }
textarea.input { min-height: 80px; resize: vertical; }
.input:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 640px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

/* ---------- page header */
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.page-head .lead { margin-top: 6px; color: var(--ink-2); }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none; font-size: .92rem; margin-bottom: 10px; }
.back:hover { color: var(--ink); }
.section { margin-top: 34px; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.pad { padding: 18px 20px; }

/* ---------- avatars */
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 750; color: #fff; flex: none;
  font-size: .95rem; letter-spacing: .02em; }
.avatar.lg { width: 64px; height: 64px; font-size: 1.45rem; }
.avatar.sm { width: 30px; height: 30px; font-size: .78rem; }

/* ---------- family register (home) */
.register { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.person-row { display: grid; grid-template-columns: minmax(220px, 1.1fr) minmax(0, 2fr) auto; gap: 20px; align-items: center;
  padding: 18px 20px; text-decoration: none; color: inherit; border-top: 1px solid var(--line); }
.person-row:first-child { border-top: 0; }
.person-row:hover { background: var(--surface-2); }
.person-id { display: flex; gap: 14px; align-items: center; min-width: 0; }
.person-id .name { font-weight: 750; font-size: 1.12rem; }
.person-id .meta { font-size: .86rem; color: var(--ink-2); }
.person-vals { display: flex; gap: 10px; flex-wrap: wrap; }
.mini { min-width: 118px; padding: 8px 12px; border-radius: 12px; background: var(--paper); }
.mini .t { font-size: .78rem; color: var(--ink-2); white-space: nowrap; }
.mini .v { font-weight: 750; font-size: 1.05rem; display: flex; align-items: baseline; gap: 5px; }
.mini .v small { font-size: .74rem; font-weight: 400; color: var(--ink-3); }
.person-flag { text-align: right; font-size: .86rem; }
@media (max-width: 899px) {
  .person-row { grid-template-columns: 1fr; gap: 12px; }
  .person-flag { text-align: left; }
  .mini { min-width: 0; flex: 1 1 30%; }
}
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius); background: var(--warn-soft);
  color: var(--ink); margin-bottom: 22px; }
.notice svg { color: var(--warn); margin-top: 2px; }

/* ---------- status */
.st { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.st.ok { color: var(--ok); background: var(--ok-soft); }
.st.warn { color: var(--warn); background: var(--warn-soft); }
.st.bad { color: var(--bad); background: var(--bad-soft); }
.st.none { color: var(--ink-3); background: var(--surface-2); }
.c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-bad { color: var(--bad); }

/* the range strip: where a value sits against its normal range */
.strip { position: relative; height: 8px; border-radius: 999px; background: var(--surface-2); min-width: 90px; }
.strip .band { position: absolute; top: 0; bottom: 0; background: var(--band); border-left: 1.5px solid var(--band-line); border-right: 1.5px solid var(--band-line); }
.strip .band.open-l { border-left: 0; border-radius: 999px 0 0 999px; }
.strip .band.open-r { border-right: 0; border-radius: 0 999px 999px 0; }
.strip .tgt { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dashed var(--target); }
.strip .dot { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--ok);
  box-shadow: 0 0 0 2.5px var(--surface); }
.strip .dot.warn { background: var(--warn); } .strip .dot.bad { background: var(--bad); } .strip .dot.none { background: var(--ink-3); }

/* ---------- person header + tabs */
.person-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.facts { display: flex; gap: 8px 22px; flex-wrap: wrap; color: var(--ink-2); font-size: .92rem; margin-top: 6px; }
.facts b { color: var(--ink); font-weight: 650; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 650; }
.tabs a[aria-current="page"] { color: var(--primary); border-bottom-color: var(--primary); }

/* key trend tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.tile { display: block; padding: 16px 16px 10px; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.tile:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.tile .t { color: var(--ink-2); font-size: .9rem; font-weight: 650; }
.tile .big { font-size: 1.9rem; font-weight: 780; line-height: 1.1; margin-top: 4px; display: flex; align-items: baseline; gap: 6px; }
.tile .big small { font-size: .85rem; font-weight: 400; color: var(--ink-3); }
.tile .sub { font-size: .82rem; color: var(--ink-2); margin-top: 2px; }
.tile svg.spark { display: block; width: 100%; height: 64px; margin-top: 8px; }

/* value list */
.vlist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.vgroup { padding: 10px 20px 4px; font-weight: 750; font-size: .92rem; color: var(--ink-2); background: var(--paper); border-top: 1px solid var(--line); }
.vgroup:first-child { border-top: 0; }
.vrow { display: grid; grid-template-columns: minmax(150px, 1.25fr) minmax(110px, .8fr) minmax(150px, 1.25fr) minmax(170px, 1.1fr); gap: 16px;
  align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.vgroup + .vrow { border-top: 0; }
a.vrow:hover { background: var(--surface-2); }
.vrow .name { font-weight: 650; }
.vrow .name small { display: block; font-weight: 400; color: var(--ink-3); font-size: .8rem; }
.vrow .val { font-weight: 750; font-size: 1.08rem; }
.vrow .val small { font-weight: 400; color: var(--ink-3); font-size: .8rem; margin-left: 3px; }
.calc, .vrow .val .calc { font-weight: 400; font-size: .72rem; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }
.vrow .rng { display: flex; flex-direction: column; gap: 6px; }
.vrow .rng .lbl { font-size: .78rem; color: var(--ink-3); }
.vrow .delta { font-size: .85rem; text-align: right; }
@media (max-width: 640px) {
  .vrow { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 12px 16px; }
  .vrow .rng { grid-column: 1 / -1; }
  .vrow .delta { grid-column: 1 / -1; text-align: left; }
}

/* reports list */
.year { font-size: 1.05rem; font-weight: 750; color: var(--ink-3); margin: 26px 0 10px; }
.rlist { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.ritem { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.ritem:first-child { border-top: 0; }
.ritem:hover { background: var(--surface-2); }
.ritem .date { font-weight: 750; }
.ritem .date small { display: block; font-weight: 400; color: var(--ink-3); font-size: .8rem; }
.ritem .what { min-width: 0; }
.ritem .what .lab { font-weight: 650; }
.ritem .what .tests { font-size: .86rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) { .ritem { grid-template-columns: 70px minmax(0, 1fr); } .ritem .st-wrap { grid-column: 2; } }

/* grid table */
.gridwrap { overflow: auto; max-height: 72vh; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
table.grid { border-collapse: separate; border-spacing: 0; font-size: .9rem; }
table.grid th, table.grid td { padding: 7px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: right; }
table.grid thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; font-weight: 700; vertical-align: bottom; line-height: 1.25; }
table.grid thead th small { display: block; font-weight: 400; color: var(--ink-3); font-size: .74rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
table.grid th.stick, table.grid td.stick { position: sticky; left: 0; background: var(--surface); text-align: left; z-index: 1; border-right: 1px solid var(--line);
  min-width: 190px; max-width: 230px; white-space: normal; }
table.grid thead th.stick { z-index: 3; }
table.grid tr.cat td { background: var(--paper); font-weight: 750; color: var(--ink-2); text-align: left; }
table.grid tr.cat td.stick { background: var(--paper); }
table.grid td.ok { color: var(--ok); } table.grid td.warn { color: var(--warn); background: var(--warn-soft); font-weight: 700; }
table.grid td.bad { color: var(--bad); background: var(--bad-soft); font-weight: 700; }
table.grid td a { color: inherit; text-decoration: none; }
table.grid td.calcv { color: var(--ink-3); font-style: italic; }

/* chart */
.chart-panel { padding: 18px 18px 10px; }
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--font); fill: var(--ink-3); font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: .88rem; font-weight: 650; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 18px 0; }
.stat { padding: 12px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.stat .t { font-size: .8rem; color: var(--ink-2); }
.stat .v { font-size: 1.25rem; font-weight: 750; }
.stat .s { font-size: .8rem; color: var(--ink-3); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .82rem; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 10px; border-radius: 3px; background: var(--band); border: 1px solid var(--band-line); display: inline-block; }
.sw.tg { background: none; border: 0; border-top: 2px dashed var(--target); height: 0; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--surface); padding: 8px 10px; border-radius: 10px; font-size: .85rem;
  box-shadow: var(--shadow); max-width: 240px; }
.tip b { display: block; font-size: 1rem; }

/* plain table */
table.plain { width: 100%; border-collapse: collapse; }
table.plain th, table.plain td { text-align: left; padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: top; }
table.plain thead th { border-top: 0; font-size: .82rem; color: var(--ink-2); font-weight: 650; }
table.plain td.num { text-align: right; font-weight: 700; }

/* medicines */
.medlist { padding: 18px 20px; }
.medlist + .medlist { margin-top: 14px; }
.meds { width: 100%; border-collapse: collapse; margin-top: 12px; }
.meds td { padding: 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
.meds td + td { padding-left: 14px; }
.dose { display: inline-flex; gap: 4px; align-items: center; }
.dose i { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-style: normal; font-size: .72rem; font-weight: 750;
  border: 1.5px solid var(--line-2); color: var(--ink-3); }
.dose i.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.badge { display: inline-block; font-size: .75rem; font-weight: 750; padding: 2px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }

/* history */
.timeline { position: relative; padding-left: 26px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl { position: relative; padding: 0 0 22px; }
.tl::before { content: ""; position: absolute; left: -24px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--primary); }
.tl .d { font-size: .85rem; color: var(--ink-2); font-weight: 650; }
.tl .h { font-weight: 750; }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-align: left; padding: 0; cursor: pointer; }
.doc img { display: block; width: 100%; height: 130px; object-fit: cover; object-position: top; background: var(--surface-2); }
.doc .cap { padding: 10px 12px; font-size: .88rem; }
.doc .cap b { display: block; }

/* overlay, sheet, toast */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 16, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: var(--radius-lg); width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 22px; box-shadow: var(--shadow); }
.dialog h2 { margin-bottom: 8px; }
.viewer { width: min(1000px, 100%); height: 90vh; display: flex; flex-direction: column; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; }
.viewer .vbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.viewer .vbody { flex: 1; overflow: auto; background: var(--surface-2); display: flex; justify-content: center; padding: 12px; }
.viewer .vbody img { max-width: 100%; height: auto; align-self: flex-start; background: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--surface);
  padding: 11px 18px; border-radius: 12px; font-weight: 650; box-shadow: var(--shadow); }
@media (min-width: 900px) { .toast { bottom: 28px; } }

/* editor */
.editor-rows { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.erow { display: grid; grid-template-columns: minmax(150px, 1.3fr) minmax(110px, 1fr) minmax(130px, 1.4fr) 44px; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.erow:first-child { border-top: 0; }
.erow .nm { font-weight: 650; }
.erow .nm small { display: block; color: var(--ink-3); font-weight: 400; font-size: .78rem; }
.erow .hint { font-size: .82rem; }
.erow .hint.warn { color: var(--warn); font-weight: 650; }
.erow .unitbox { display: flex; align-items: center; gap: 8px; }
.erow .unitbox span { color: var(--ink-3); font-size: .85rem; white-space: nowrap; min-width: 86px; }
@media (max-width: 640px) { .erow { grid-template-columns: minmax(0, 1fr) 44px; } .erow .unitbox, .erow .hint { grid-column: 1 / 2; } .erow > .icon-btn { grid-row: 1; grid-column: 2; } }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
.search-pop { position: relative; }
.search-results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius);
  box-shadow: var(--shadow); max-height: 300px; overflow: auto; }
.search-results button { display: flex; width: 100%; justify-content: space-between; gap: 10px; padding: 10px 14px; border: 0; background: none; text-align: left; cursor: pointer; }
.search-results button:hover, .search-results button.active { background: var(--surface-2); }
.empty { text-align: center; padding: 36px 20px; color: var(--ink-2); }

/* welcome */
.welcome { max-width: 680px; margin: 7vh auto 0; }
.welcome h1 { font-size: 2.4rem; }
.drop { margin-top: 28px; border: 2px dashed var(--line-2); border-radius: var(--radius-lg); padding: 30px 24px; text-align: center; background: var(--surface); }
.drop.over { border-color: var(--primary); background: var(--primary-soft); }
.steps { margin: 26px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; color: var(--ink-2); }
.steps li b { color: var(--ink); }
.steps .n { width: 26px; height: 26px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 750; font-size: .85rem; flex: none; }

@media (prefers-reduced-motion: no-preference) {
  .page { animation: rise .22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
@media print { .rail, .topbar, .bottombar, .no-print { display: none !important; } .shell { display: block; } main { padding: 0; } }
.shell.no-rail { grid-template-columns: 1fr; }
.shell.no-rail .rail, .shell.no-rail .topbar { display: none; }
body.bare .bottombar { display: none; }

.chip svg.i { width: 16px; height: 16px; }
.meds { table-layout: fixed; }
.meds td:nth-child(1) { width: 46%; } .meds td:nth-child(2) { width: 18%; }
table.grid th.stick a { text-decoration: none; } table.grid th.stick a:hover { text-decoration: underline; }
.tl a.small { color: var(--ink-3); }
.flag-note { display: block; margin-top: 4px; }
@media (max-width: 899px) {
  .flag-note { display: inline; margin: 0 0 0 6px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { padding: 12px 12px 8px; }
  .tile .big { font-size: 1.45rem; }
  .tile .sub { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
}
.syncpill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .84rem; font-weight: 650; cursor: pointer; color: var(--ink-2); max-width: 100%; }
.syncpill svg { flex: none; } .syncpill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.syncpill.c-ok svg { color: var(--ok); } .syncpill.c-warn { color: var(--warn); border-color: var(--warn-soft); background: var(--warn-soft); } .syncpill.c-bad { color: var(--bad); background: var(--bad-soft); }
.syncpill-slot { display: block; }
.topbar .syncpill-slot.compact .syncpill span { display: none; }
.topbar .syncpill-slot.compact .syncpill { padding: 8px; border: 0; background: transparent; }
.topbar .syncpill-slot.compact .syncpill.c-warn span, .topbar .syncpill-slot.compact .syncpill.c-bad span { display: inline; max-width: 120px; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }
details summary { cursor: pointer; color: var(--ink-2); }
.rail .syncpill span { white-space: normal; text-align: left; }
.progress { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 12px; }
.progress span { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s; }
.rlist2 { display: flex; flex-direction: column; gap: 12px; }
.rrow { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 16px 14px 10px; }
.rrow.off { opacity: .55; background: var(--paper); }
.rrow.off .snip { filter: grayscale(1); }
.rinc { display: flex; justify-content: center; padding-top: 4px; }
.rinc input { width: 20px; height: 20px; accent-color: var(--primary); }
.snip { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.rfields { display: grid; grid-template-columns: minmax(180px, 1.3fr) minmax(150px, 1fr) minmax(140px, 1.2fr); gap: 10px; align-items: center; margin-top: 10px; }
.rfields .unitbox { display: flex; align-items: center; gap: 8px; } .rfields .unitbox span { color: var(--ink-3); font-size: .85rem; white-space: nowrap; }
.rstat { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rwarn { margin-top: 8px; font-size: .86rem; color: var(--warn); font-weight: 650; }
.rrow .faint.small { margin-top: 6px; }
@media (max-width: 640px) { .rfields { grid-template-columns: 1fr; } }
.only-touch { display: none; }
@media (hover: none) and (pointer: coarse) { .only-touch { display: inline-flex; } }
a.notice:hover { filter: brightness(.98); }
.snip { max-width: 640px; }

<div id="app" class="shell">

const DB_NAME = 'family-health', DB_VER = 1;
const STORES = ['members', 'tests', 'targetSets', 'reports', 'results', 'events', 'medicines', 'documents', 'meta'];

      rq.onsuccess = () => { this.db = rq.result; res(this.db); };
      rq.onerror = () => rej(rq.error);
    });
  },
  all(store) { return new Promise((res, rej) => { const rq = this.db.transaction(store).objectStore(store).getAll(); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); },
  put(store, items) {

    let dev = this.meta.get('device');
    if (!dev) { dev = { id: 'device', deviceId: uid(), createdAt: nowIso() }; await idb.put('meta', dev); this.meta.set('device', dev); }
    this.deviceId = dev.deviceId;

  reindex() {

    for (const list of this.byMember.values()) list.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.time || '').localeCompare(a.time || ''));
    for (const x of this.live('results')) { if (!this.resByReport.has(x.reportId)) this.resByReport.set(x.reportId, []); this.resByReport.get(x.reportId).push(x); }

/* ================= import / merge ================= */
const COLLECTIONS = ['members', 'tests', 'targetSets', 'reports', 'results', 'events', 'medicines', 'documents'];
async function importData(obj) {
  if (!obj || !['family-health-seed', 'family-health-backup'].includes(obj.format)) throw new Error('This file is not a family health data file. Choose family_health_seed.json or a backup made by this app.');
  const summary = { added: 0, updated: 0, unchanged: 0 };
  for (const c of COLLECTIONS) {
    const incoming = obj[c] || [];
    const put = [];
    for (const [idx, rec0] of incoming.entries()) {
      const rec = (c === 'members' && rec0 && rec0.order === undefined) ? { ...rec0, order: idx } : rec0;
      if (!rec || !rec.id) continue;
      const cur = S[c].get(rec.id);
      if (!cur) { put.push(rec); summary.added++; }
      else if ((rec.updatedAt || '') > (cur.updatedAt || '')) { put.push(rec); summary.updated++; }
      else summary.unchanged++;
    }
    if (put.length) { await idb.put(c, put); put.forEach(r => S[c].set(r.id, r)); if (typeof SYNC !== 'undefined') await SYNC.markDirty(c, put); }
  }
  if (obj.reviewItems) {
    const open = obj.reviewItems.filter(r => r.status === 'open');
    const cur = S.getMeta('openItems', []);
    const merged = [...cur.filter(x => !open.find(o => o.no === x.no)), ...open.filter(o => !(S.getMeta('resolvedItems', [])).includes(o.no))];
    await S.setMeta('openItems', merged);
  }
  S.reindex();
  return summary;
}
function backupObject() {
  const o = { format: 'family-health-backup', schemaVersion: 1, createdAt: nowIso(), createdBy: S.deviceId };
  COLLECTIONS.forEach(c => { o[c] = [...S[c].values()]; });
  o.reviewItems = S.getMeta('openItems', []);
  return o;
}

async function saveFile(filename, data, mime) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) {
        const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
        await dl.save({ filename, data: blob });
        return true;
      }
    }
  } catch (e) {
    if (e && e.code === 'declined') return false;
    if (e && !['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { toast('Could not save the file: ' + (e.message || e.code)); return false; }
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}

const tnum = iso => new Date(iso + 'T00:00:00').getTime();
const statusColor = s => `var(--${s === 'ok' ? 'ok' : s === 'warn' ? 'warn' : s === 'bad' ? 'bad' : 'ink-3'})`;

function yDomain(points, r, tg) {
  const vals = points.map(p => p.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const extra = [];
  if (r) { if (r.low !== undefined) extra.push(r.low); if (r.high !== undefined) extra.push(r.high); }
  if (tg) { if (tg.low !== undefined) extra.push(tg.low); if (tg.high !== undefined) extra.push(tg.high); }
  const span0 = (hi - lo) || Math.abs(hi) * 0.3 || 1;
  extra.forEach(v => { if (v >= lo - span0 * 1.2 && v <= hi + span0 * 1.2) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
  const pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.1 || 1;
  lo -= pad; hi += pad;
  if (Math.min(...vals) >= 0 && lo < 0) lo = 0;
  return [lo, hi];
}

function bandRect(r, y, top, bottom, x0, x1) {
  if (!r || (r.low === undefined && r.high === undefined)) return '';
  const yh = r.high !== undefined ? Math.max(top, Math.min(bottom, y(r.high))) : top;
  const yl = r.low !== undefined ? Math.max(top, Math.min(bottom, y(r.low))) : bottom;
  if (yl - yh <= 0) return '';
  let s = `<rect x="${x0}" y="${yh}" width="${x1 - x0}" height="${yl - yh}" fill="var(--band)"/>`;
  if (r.high !== undefined && y(r.high) >= top && y(r.high) <= bottom) s += `<line x1="${x0}" x2="${x1}" y1="${yh}" y2="${yh}" stroke="var(--band-line)" stroke-width="1"/>`;
  if (r.low !== undefined && y(r.low) >= top && y(r.low) <= bottom) s += `<line x1="${x0}" x2="${x1}" y1="${yl}" y2="${yl}" stroke="var(--band-line)" stroke-width="1"/>`;
  return s;
}

function trendChart(el, { points, member, testId, onPick }) {
  const test = S.test(testId); const r = rangeFor(test, member); const tg = targetFor(testId, member);
  const W = Math.max(300, el.clientWidth || 700), H = W < 520 ? 240 : 300;
  const m = { l: 48, r: 16, t: 14, b: 30 };
  if (!points.length) { el.innerHTML = '<p class="empty">No readings in this period.</p>'; return; }
  const [lo, hi] = yDomain(points, r, tg);
  const t0 = tnum(points[0].date), t1 = tnum(points[points.length - 1].date);
  const tpad = (t1 - t0) * 0.03 || 864e5 * 20;
  const x = t => m.l + ((t - (t0 - tpad)) / ((t1 + tpad) - (t0 - tpad))) * (W - m.l - m.r);
  const y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const ticks = niceTicks(lo, hi, W < 520 ? 4 : 5);
  const y0 = new Date(t0 - tpad).getFullYear(), y1 = new Date(t1 + tpad).getFullYear();
  const yrs = []; const ystep = Math.max(1, Math.ceil((y1 - y0 + 1) / (W < 520 ? 5 : 9)));
  for (let yy = y0; yy <= y1 + 1; yy += ystep) { const tx = x(new Date(yy, 0, 1).getTime()); if (tx >= m.l && tx <= W - m.r) yrs.push([yy, tx]); }
  const monthly = (t1 - t0) < 864e5 * 400;
  let xt = yrs.map(([yy, tx]) => `<line x1="${tx}" x2="${tx}" y1="${m.t}" y2="${H - m.b}" stroke="var(--line)"/><text x="${tx + 4}" y="${H - 10}">${yy}</text>`).join('');
  if (monthly) {
    xt = ''; const d0 = new Date(t0 - tpad); d0.setDate(1);
    const step = Math.max(1, Math.ceil(((t1 - t0) / (864e5 * 30)) / 6));
    for (let d = new Date(d0); d.getTime() <= t1 + tpad; d.setMonth(d.getMonth() + step)) {
      const tx = x(d.getTime()); if (tx < m.l || tx > W - m.r) continue;
      xt += `<line x1="${tx}" x2="${tx}" y1="${m.t}" y2="${H - m.b}" stroke="var(--line)"/><text x="${tx + 4}" y="${H - 10}">${MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</text>`;
    }
  }
  const yt = ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v === 0 ? '' : '2 4'}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`).join('');
  const band = bandRect(r, y, m.t, H - m.b, m.l, W - m.r);
  const tgv = tg ? (tg.high !== undefined ? tg.high : tg.low) : undefined;
  const tgl = tgv !== undefined && tgv >= lo && tgv <= hi ? `<line x1="${m.l}" x2="${W - m.r}" y1="${y(tgv)}" y2="${y(tgv)}" stroke="var(--target)" stroke-width="2" stroke-dasharray="6 5"/>` : '';
  const pts = points.map(p => ({ ...p, px: x(tnum(p.date)), py: y(p.value), st: statusOf(testId, p.value, member).s }));
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${p.px.toFixed(1)},${p.py.toFixed(1)}`).join('');
  const rad = W < 520 ? (pts.length > 30 ? 3 : 4) : (pts.length > 60 ? 3.5 : 5);
  const dots = pts.map((p, i) => p.calc
    ? `<circle cx="${p.px}" cy="${p.py}" r="${rad}" fill="var(--surface)" stroke="${statusColor(p.st)}" stroke-width="2" data-i="${i}"/>`
    : `<circle cx="${p.px}" cy="${p.py}" r="${rad}" fill="${statusColor(p.st)}" stroke="var(--surface)" stroke-width="1.5" data-i="${i}"/>`).join('');
  const last = pts[pts.length - 1];
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(test.name)} over time, ${points.length} readings from ${fmtDate(points[0].date)} to ${fmtDate(last.date)}. Latest ${fmtNum(last.value)}.">
    ${band}${yt}${xt}${tgl}
    <path d="${path}" fill="none" stroke="var(--ink-2)" stroke-width="1.6" stroke-linejoin="round" opacity=".75"/>
    ${dots}
    <circle cx="${last.px}" cy="${last.py}" r="${rad + 4}" fill="none" stroke="${statusColor(last.st)}" stroke-width="2" opacity=".5"/>
    <line class="cursor" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-3)" stroke-dasharray="3 3" style="display:none"/>
    <rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" class="hit" style="cursor:crosshair"/>
  </svg>`;
  const svg = $('svg', el), cur = $('.cursor', svg);
  let tip = null;
  const nearest = (evt) => {
    const b = svg.getBoundingClientRect(); const sx = (evt.clientX - b.left) * (W / b.width);
    let best = null; pts.forEach(p => { const d = Math.abs(p.px - sx); if (!best || d < best.d) best = { d, p }; });
    return best && best.p;
  };
  const show = (evt) => {
    const p = nearest(evt); if (!p) return;
    cur.style.display = ''; cur.setAttribute('x1', p.px); cur.setAttribute('x2', p.px);
    if (!tip) { tip = h('<div class="tip"></div>'); document.body.appendChild(tip); }
    const st = statusOf(testId, p.value, member);
    tip.innerHTML = `<b>${fmtNum(p.value)} ${esc(test.unit || '')}</b>${fmtDate(p.date)}${p.report.lab ? '<br>' + esc(p.report.lab) : ''}${p.calc ? '<br>Calculated' : ''}${st.s !== 'none' && st.s !== 'ok' ? '<br>Outside normal range' : ''}`;
    const tx = Math.min(window.innerWidth - 250, evt.clientX + 14); tip.style.left = tx + 'px'; tip.style.top = (evt.clientY - 70) + 'px';
  };
  const hide = () => { cur.style.display = 'none'; if (tip) { tip.remove(); tip = null; } };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('click', e => { const p = nearest(e); hide(); if (p && onPick) onPick(p); });
}

function sparkline(points, testId, member, W = 240, H = 64) {
  if (points.length < 2) return '';
  const r = rangeFor(S.test(testId), member);
  const [lo, hi] = yDomain(points, r, null);
  const t0 = tnum(points[0].date), t1 = tnum(points[points.length - 1].date);
  const x = t => 4 + ((t - t0) / ((t1 - t0) || 1)) * (W - 12);
  const y = v => 5 + (1 - (v - lo) / (hi - lo)) * (H - 10);
  const band = bandRect(r, y, 0, H, 0, W);
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${x(tnum(p.date)).toFixed(1)},${y(p.value).toFixed(1)}`).join('');
  const lp = points[points.length - 1]; const st = statusOf(testId, lp.value, member).s;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${band}
    <path d="${path}" fill="none" stroke="var(--ink-2)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${x(tnum(lp.date))}" cy="${y(lp.value)}" r="4" fill="${statusColor(st)}" vector-effect="non-scaling-stroke"/></svg>`;
}

'use strict';
/* ---------- minimal zip (store, no compression) ---------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(buf) { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {
  const enc = new TextEncoder(); const parts = []; const central = []; let offset = 0;
  const d = new Date(); const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name); const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data; const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const csize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, csize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

const xesc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
const colName = n => { let s = ''; n++; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const excelDate = iso => { const [y, m, d] = iso.split('-').map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; };

/* sheet: {name, rows: [[cell]], widths: [], freeze: {col,row}} ; cell: null | value | {v, s, date} */
function sheetXml(sh) {
  const rowsXml = sh.rows.map((row, ri) => {
    const cells = (row || []).map((c, ci) => {
      if (c === null || c === undefined || c === '') return '';
      const cell = typeof c === 'object' ? c : { v: c };
      const ref = colName(ci) + (ri + 1);
      let s = cell.s ?? XS.base;
      if (cell.date) return `<c r="${ref}" s="${cell.s ?? XS.date}"><v>${excelDate(cell.v)}</v></c>`;
      if (typeof cell.v === 'number' && isFinite(cell.v)) return `<c r="${ref}" s="${s}"><v>${cell.v}</v></c>`;
      return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xesc(cell.v)}</t></is></c>`;
    }).join('');
    return `<row r="${ri + 1}"${sh.heights && sh.heights[ri] ? ` ht="${sh.heights[ri]}" customHeight="1"` : ''}>${cells}</row>`;
  }).join('');
  const f = sh.freeze;
  const pane = f ? `<pane xSplit="${f.col}" ySplit="${f.row}" topLeftCell="${colName(f.col)}${f.row + 1}" activePane="bottomRight" state="frozen"/><selection pane="bottomRight"/>` : '';
  const cols = sh.widths ? `<cols>${sh.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheetViews><sheetView workbookViewId="0"${f ? '' : ''}>${pane}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${rowsXml}</sheetData>
${sh.autoFilter ? `<autoFilter ref="${sh.autoFilter}"/>` : ''}</worksheet>`;
}
function buildXlsx(sheets) {
  const used = new Set();
  sheets.forEach(s => { let n = s.name.replace(/[\[\]:*?/\\]/g, ' ').slice(0, 31).trim() || 'Sheet'; let k = 2; const b = n; while (used.has(n.toLowerCase())) n = (b.slice(0, 28) + ' ' + k++); used.add(n.toLowerCase()); s.name = n; });
  const files = [
    { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` },
    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>${sheets.map((s, i) => `<sheet name="${xesc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets>${sheets.some(s => s.autoFilter) ? `<definedNames>${sheets.map((s, i) => s.autoFilter ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xesc(s.name).replace(/'/g, "''")}'!${s.autoFilter.replace(/([A-Z]+)(\d+)/g, '$$$1$$$2')}</definedName>` : '').join('')}</definedNames>` : ''}</workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/styles.xml', data: STYLES_XML },
    ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s) })),
  ];
  return zipStore(files);
}

/* ---------- export layout: one grid sheet per person + an "All values" list ---------- */
function exportWorkbook(memberIds) {
  const sheets = []; const all = [];
  const people = S.memberOrder.filter(m => memberIds.includes(m.id));
  for (const m of people) {
    const reps = S.reportsOf(m).filter(r => r.date).slice().reverse();          // oldest first, like your original sheets
    const testIds = new Set(); reps.forEach(r => S.resultsOf(r).forEach(x => testIds.add(x.testId)));
    const groups = testsByCategory([...testIds]);
    const rows = [];
    rows.push([{ v: `${m.name}: all reports`, s: XS.title }]);
    rows.push([{ v: `Born ${m.dob ? fmtDate(m.dob) : 'not recorded'}. ${reps.length} reports. Exported ${fmtDate(todayIso())} from Family Health. Coloured cells are outside the normal range.`, s: XS.muted }]);
    rows.push([]);
    rows.push([{ v: 'Test', s: XS.head }, { v: 'Unit', s: XS.head }, { v: 'Normal range', s: XS.head }, ...reps.map(r => ({ v: r.date, date: true, s: XS.headDate }))]);
    rows.push([{ v: 'Lab', s: XS.cat }, { v: '', s: XS.cat }, { v: '', s: XS.cat }, ...reps.map(r => ({ v: r.lab || '', s: XS.cat }))]);
    for (const [cat, tests] of groups) {
      rows.push([{ v: cat, s: XS.cat }, ...Array(reps.length + 2).fill({ v: '', s: XS.cat })]);
      for (const t of tests) {
        const r = rangeFor(t, m);
        const row = [{ v: t.name }, { v: t.unit || '' }, { v: rangeText(r, '') || '' }];
        for (const rep of reps) {
          const x = S.resultsOf(rep).find(x => x.testId === t.id);
          if (!x) { row.push(null); continue; }
          const st = statusOf(t.id, x.value, m).s;
          const s = st === 'bad' ? XS.bad : st === 'warn' ? XS.warn : XS.num;
          row.push(typeof x.value === 'number' ? { v: x.value, s } : { v: x.text || '', s: XS.base });
          all.push([m.name, rep.date, rep.lab || '', t.category, t.name, x.value, t.unit || '', x.text || '', rangeText(r, ''),
            st === 'ok' ? 'In range' : st === 'warn' || st === 'bad' ? (statusOf(t.id, x.value, m).dir === 'high' ? 'High' : 'Low') : '', x.calculated ? 'Yes' : '']);
        }
        rows.push(row);
      }
    }
    sheets.push({ name: m.name, rows, widths: [34, 11, 16, ...reps.map(() => 12.5)], freeze: { col: 3, row: 5 }, heights: { 3: 30 } });
  }
  const ord = new Map(people.map((p, i) => [p.name, i])); all.sort((a, b) => (ord.get(a[0]) - ord.get(b[0])) || a[1].localeCompare(b[1]));
  const head = ['Person', 'Date', 'Lab', 'Category', 'Test', 'Value', 'Unit', 'Text result', 'Normal range', 'Status', 'Calculated in the old sheet'];
  const listRows = [head.map(v => ({ v, s: XS.head })), ...all.map(a => a.map((v, i) => i === 1 ? { v, date: true } : (i === 5 ? (typeof v === 'number' ? { v, s: XS.num } : null) : { v: v ?? '' })))];
  sheets.push({ name: 'All values', rows: listRows, widths: [18, 13, 26, 18, 32, 10, 12, 22, 16, 10, 12], freeze: { col: 0, row: 1 }, autoFilter: `A1:K${listRows.length}` });
  return buildXlsx(sheets);
}

function deltaHtml(id, cur, prev, m) {
  const c = changeInfo(id, cur, prev && prev.value, m);
  if (!c) return '';
  if (c.diff === 0) return `<span class="faint">No change since ${fmtDate(prev.report.date)}</span>`;
  return `<span class="${c.cls}">${icon(c.ic)} ${c.diff > 0 ? 'Up' : 'Down'} ${fmtNum(Math.abs(c.diff))}</span> <span class="faint">since ${fmtDate(prev.report.date)}</span>`;
}
function valueRow(m, t, x, date, opts = {}) {
  const num = typeof x.value === 'number'; const st = statusOf(t.id, x.value, m);
  const r = rangeFor(t, m); const tg = targetFor(t.id, m);
  const lbl = [r && `Normal ${esc(rangeText(r, t.unit))}`, tg && `<span style="color:var(--target)">Target ${esc(rangeText(tg, ''))}</span>`].filter(Boolean).join('. ');
  const href = opts.link !== false ? `#/p/${esc(m.key)}/test/${esc(t.id)}` : null;
  const tag = href ? 'a' : 'div';
  return `<${tag} class="vrow" ${href ? `href="${href}"` : ''}><div class="name">${esc(t.name)}${opts.sub ? `<small>${opts.sub}</small>` : ''}</div>
    <div class="val"><span class="c-${num ? st.s : ''}">${esc(valueText(x, t))}</span>${num ? unitHtml(t) : ''}${x.calculated || opts.calc ? '<span class="calc" title="Calculated, not from the lab report">calc</span>' : ''}</div>
    <div class="rng">${num ? stripHtml(t.id, x.value, m) : ''}${lbl ? `<span class="lbl">${lbl}</span>` : ''}</div>
    <div class="delta">${num && st.s !== 'none' ? statusChip(st) : ''}${num && targetMet(tg, x.value) === false ? ` <span class="st" style="color:var(--target);background:var(--primary-soft)">Above target</span>`.replace('Above', tg.high !== undefined ? 'Above' : 'Below') : ''}${opts.delta ? `<div class="small" style="margin-top:4px">${opts.delta}</div>` : ''}</div></${tag}>`;
}

function personOverview(m) {
  const reps = S.reportsOf(m); const last = reps[0];
  const fl = flaggedIn(m, last);
  const tiles = [];
  for (const id of KEY_TESTS) {
    const pts = seriesOf(m, id).filter(p => typeof p.value === 'number');
    if (pts.length < 2) continue;
    const lp = pts[pts.length - 1]; const t = S.test(id); const st = statusOf(id, lp.value, m);
    let big = fmtNum(lp.value);
    if (id === 'bp_sys') { const d = S.resultsOf(lp.report).find(x => x.testId === 'bp_dia'); if (d) big += '/' + fmtNum(d.value); }
    tiles.push(`<a class="tile" href="#/p/${esc(m.key)}/test/${id}"><div class="t">${esc(t.name)}</div>
      <div class="big"><span class="c-${st.s === 'none' ? '' : st.s}">${big}</span><small>${esc(t.unit || '')}</small></div>
      <div class="sub">${statusChip(st)} <span class="faint">${fmtDate(lp.date)}</span></div><div class="spark-slot" data-test="${id}"></div></a>`);
    if (tiles.length >= 8) break;
  }
  const lv = latestValues(m);
  const ids = [...lv.keys()];
  DERIVED.forEach(id => { if (seriesOf(m, id).length) ids.push(id); });
  const groups = testsByCategory([...new Set(ids)]);
  let list = '';
  for (const [cat, tests] of groups) {
    list += `<div class="vgroup">${esc(cat)}</div>`;
    for (const t of tests) {
      if (DERIVED.includes(t.id) && !lv.has(t.id)) {
        const pts = seriesOf(m, t.id); const lp = pts[pts.length - 1]; const pp = pts[pts.length - 2];
        list += valueRow(m, t, { value: lp.value }, lp.date, { calc: true, sub: fmtDate(lp.date), delta: pp ? deltaHtml(t.id, lp.value, { value: pp.value, report: pp.report }, m) : '' });
        continue;
      }
      const e = lv.get(t.id);
      const sub = e.report.id !== last.id ? fmtDate(e.report.date) : 'Latest report';
      list += valueRow(m, t, e.x, e.report.date, { sub, delta: typeof e.x.value === 'number' ? deltaHtml(t.id, e.x.value, e.prev, m) : '' });
    }
  }
  return `<a class="panel pad" href="#/r/${esc(last.id)}" style="display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;flex-wrap:wrap">
      <div style="flex:1;min-width:220px"><div class="faint small">Latest report</div><h2>${fmtDate(last.date)}${last.lab ? `<span class="muted" style="font-weight:400">, ${esc(last.lab)}</span>` : ''}</h2>
      <div class="muted small" style="margin-top:4px">${S.resultsOf(last).length} values${fl.length ? `, ${fl.length} outside the normal range` : ', all within the normal range'}</div></div>
      ${fl.length ? `<span class="st warn">${icon('alert')}${fl.map(x => esc(SHORT[x.testId] || S.test(x.testId).name)).slice(0, 3).join(', ')}${fl.length > 3 ? ' and more' : ''}</span>` : `<span class="st ok">${icon('check')}All in range</span>`}
      <span class="btn small">Open report ${icon('chevron')}</span></a>
    ${tiles.length ? `<div class="section"><div class="section-head"><h2>Key trends</h2><span class="faint small">Tap a card to see the full history</span></div><div class="tiles">${tiles.join('')}</div></div>` : ''}
    <div class="section"><div class="section-head"><h2>Most recent value of every test</h2></div>
      <div class="legend" style="margin:-4px 0 12px"><span><i class="sw"></i>Normal range</span>${m.targetSet ? '<span><i class="sw tg"></i>Your target</span>' : ''}<span><span class="calc" style="margin:0">calc</span>&nbsp;calculated from other values</span></div>
      <div class="vlist">${list}</div></div>`;
}

function personTable(m) {

    <div class="gridwrap"><table class="grid"><thead><tr><th class="stick" scope="col">Test</th>${cols}</tr></thead><tbody>${body}</tbody></table></div>`;

function doseHtml(s) {

  const lab = ['M', 'A', 'N'], full = ['Morning', 'Afternoon', 'Night'];
  return `<span class="dose" title="${full.map((f, i) => `${f}: ${m[i + 1]}`).join(', ')}" aria-label="${full.map((f, i) => `${f} ${m[i + 1]}`).join(', ')}">${[1, 2, 3].map(i => `<i class="${+m[i] > 0 ? 'on' : ''}">${+m[i] > 1 ? m[i] : lab[i - 1]}</i>`).join('')}</span>`;
}

/* ---------------- trend ---------------- */
function viewTrend(m, testId) {
  const t = S.test(testId); const all = seriesOf(m, testId);
  const r = rangeFor(t, m); const tg = targetFor(testId, m);
  const numeric = all.some(p => typeof p.value === 'number');
  const period = S.getMeta('trendPeriod', 'all');
  const periods = [['all', 'All'], ['10', '10 years'], ['5', '5 years'], ['2', '2 years'], ['1', '1 year']];
  const pts = numeric ? all.filter(p => typeof p.value === 'number' && (period === 'all' || yearsAgo(p.date) <= +period)) : all;
  let stats = '';
  if (numeric && pts.length) {
    const vals = pts.map(p => p.value); const lp = pts[pts.length - 1]; const pp = pts[pts.length - 2];
    const lo = pts.reduce((a, b) => b.value < a.value ? b : a), hi = pts.reduce((a, b) => b.value > a.value ? b : a);
    const inr = pts.filter(p => statusOf(testId, p.value, m).s === 'ok').length;
    const c = pp ? changeInfo(testId, lp.value, pp.value, m) : null;
    stats = `<div class="stats"><div class="stat"><div class="t">Latest</div><div class="v c-${statusOf(testId, lp.value, m).s}">${fmtNum(lp.value)} <small class="faint">${esc(t.unit || '')}</small></div><div class="s">${fmtDate(lp.date)}</div></div>
      ${c ? `<div class="stat"><div class="t">Change from previous</div><div class="v ${c.cls}">${c.diff > 0 ? '+' : c.diff < 0 ? '−' : ''}${fmtNum(Math.abs(c.diff))}</div><div class="s">since ${fmtDate(pp.date)}</div></div>` : ''}
      <div class="stat"><div class="t">Lowest</div><div class="v">${fmtNum(lo.value)}</div><div class="s">${fmtDate(lo.date)}</div></div>
      <div class="stat"><div class="t">Highest</div><div class="v">${fmtNum(hi.value)}</div><div class="s">${fmtDate(hi.date)}</div></div>
      ${r ? `<div class="stat"><div class="t">Within normal range</div><div class="v">${inr} of ${vals.length}</div><div class="s">readings in this period</div></div>` : ''}</div>`;
  }
  const rows = pts.slice().reverse().map(p => { const st = statusOf(testId, p.value, m);
    return `<tr><td><a href="#/r/${esc(p.report.id)}">${fmtDate(p.date)}</a></td><td class="muted">${esc(p.report.lab || '')}</td>
      <td class="num">${esc(typeof p.value === 'number' ? fmtNum(p.value) : p.text)}${p.calc ? ' <span class="faint small">calc</span>' : ''}</td><td>${typeof p.value === 'number' ? statusChip(st) : ''}</td></tr>`; }).join('');
  return `<div class="page"><a class="back" href="#/p/${esc(m.key)}">${icon('back')}${esc(m.name)}</a>
    <div class="page-head"><div><h1>${esc(t.name)}</h1><p class="lead">${[r && `Normal range ${esc(rangeText(r, t.unit))}`, tg && `<span style="color:var(--target)">Your target ${esc(rangeText(tg, t.unit))} (${esc(tg.name)})</span>`, t.calculated && `Calculated as ${esc(t.calculated)}`].filter(Boolean).join('. ') || esc(t.category)}</p></div></div>
    ${numeric ? `<div class="row" style="margin-bottom:12px"><div class="chips" role="group" aria-label="Time period">${periods.map(([k, l]) => `<button class="chip" data-period="${k}" aria-pressed="${period === k}">${l}</button>`).join('')}</div></div>
      <div class="panel chart-panel"><div id="chart"></div><div class="legend">${r ? '<span><i class="sw"></i>Normal range</span>' : ''}${tg ? '<span><i class="sw tg"></i>Your target</span>' : ''}
        <span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="var(--ok)"/></svg>In range</span><span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="var(--warn)"/></svg>Outside</span><span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="var(--bad)"/></svg>Far outside</span>
        <span class="faint">Tap a point to open that report</span></div></div>${stats}` : ''}

function afterEditor(route) {
  const form = $('#rep-form'); if (!form) return;
  const rowsEl = $('#erows');
  const rows = [];                                        // {testId, value}
  const memberNow = () => S.members.get(form.member.value);
  const typical = (tid) => {
    const vals = seriesOf(memberNow(), tid).map(p => p.value).filter(v => typeof v === 'number').sort((a, b) => a - b);
    return vals.length >= 3 ? vals[Math.floor(vals.length / 2)] : null;
  };
  const hint = (tid, raw) => {
    const m = memberNow();
    if (tid === 'BP') {
      if (!raw) return { html: '<span class="faint">Type it as 120/80</span>' };
      const mm = /^\s*(\d{2,3})\s*\/\s*(\d{2,3})\s*$/.exec(raw);
      if (!mm) return { html: 'Type it as 120/80', warn: true };
      const a = statusOf('bp_sys', +mm[1], m), b = statusOf('bp_dia', +mm[2], m);
      return { html: statusChip(a.s === 'ok' && b.s === 'ok' ? a : (a.s !== 'ok' ? a : b)) };
    }
    const t = S.test(tid);
    if (t.type === 'text') return { html: raw ? '' : `<span class="faint">For example ${esc(TEXT_SUGGEST.slice(0, 2).join(' or '))}</span>` };
    const r = rangeFor(t, m);
    if (raw === '' || raw === undefined) return { html: r ? `<span class="faint">Normal ${esc(rangeText(r, t.unit))}</span>` : '' };
    const v = parseFloat(String(raw).replace(/,/g, ''));
    if (isNaN(v)) return { html: 'Enter a number', warn: true };
    const pl = t.plausible;
    if (pl && (v < pl[0] || v > pl[1])) return { html: `Unusual for ${esc(t.name)} (usually ${fmtNum(pl[0])} to ${fmtNum(pl[1])}). Check the decimal point and zeros.`, warn: true };
    const ty = typical(tid);
    if (ty && ty > 0 && v > 0 && (v / ty > 4 || v / ty < 0.25)) return { html: `Very different from usual (${fmtNum(ty)}). Check the decimal point and zeros.`, warn: true };
    return { html: statusChip(statusOf(tid, v, m)) };
  };
  const draw = () => {
    rowsEl.innerHTML = rows.length ? rows.map((row, i) => {
      const isBp = row.testId === 'BP'; const t = isBp ? { name: 'Blood pressure', unit: 'mmHg', type: 'bp' } : S.test(row.testId);
      const hn = hint(row.testId, row.value);
      const inputType = t.type === 'text' ? `<input class="input" data-i="${i}" value="${esc(row.value ?? '')}" list="textsug" aria-label="${esc(t.name)}">`
        : `<input class="input" data-i="${i}" value="${esc(row.value ?? '')}" inputmode="${isBp ? 'text' : 'decimal'}" aria-label="${esc(t.name)}" placeholder="${isBp ? '120/80' : ''}">`;
      return `<div class="erow"><div class="nm">${esc(t.name)}<small>${esc(isBp ? 'systolic / diastolic' : t.category)}</small></div>
        <div class="unitbox">${inputType}<span>${esc(t.unit || '')}</span></div><div class="hint ${hn.warn ? 'warn' : ''}" id="h${i}">${hn.html}</div>
        <button type="button" class="icon-btn" data-rm="${i}" aria-label="Remove ${esc(t.name)}">${icon('close')}</button></div>`;
    }).join('') + `<datalist id="textsug">${TEXT_SUGGEST.map(s => `<option value="${s}">`).join('')}</datalist>`
      : '<div class="empty">No values yet. Tap a group above, or search for a test.</div>';
    $('#count').textContent = rows.length ? `${rows.filter(r => String(r.value ?? '').trim() !== '').length} of ${rows.length} filled in` : '';
  };
  const add = (tid, value = '') => { if (rows.some(r => r.testId === tid)) return false; rows.push({ testId: tid, value }); return true; };
  if (route.report) {

  }

      const score = t.name.toLowerCase().startsWith(q) ? 3 : hay.includes(q) ? 1 : 0; return { t, score }; })

  // save
  form.addEventListener('submit', async e => {
    e.preventDefault(); const err = $('#form-err'); err.textContent = '';
    const mid = form.member.value, date = form.date.value;
    if (!date) { err.textContent = 'Enter the date of the report.'; form.date.focus(); return; }
    const filled = rows.filter(r => String(r.value ?? '').trim() !== '');
    const notes = form.notes.value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!filled.length && !notes.length) { err.textContent = 'Enter at least one value, or a note.'; return; }
    const out = [];
    for (const r of filled) {
      if (r.testId === 'BP') {
        const mm = /^\s*(\d{2,3})\s*\/\s*(\d{2,3})\s*$/.exec(r.value);
        if (!mm) { err.textContent = 'Blood pressure should look like 120/80.'; return; }
        out.push({ testId: 'bp_sys', value: +mm[1] }, { testId: 'bp_dia', value: +mm[2] }); continue;
      }
      const t = S.test(r.testId);
      if (t.type === 'text') { out.push({ testId: r.testId, text: String(r.value).trim() }); continue; }
      const raw = String(r.value).replace(/,/g, '').trim(); const q = /^[<>]/.exec(raw);
      const v = parseFloat(raw.replace(/^[<>]=?\s*/, ''));
      if (isNaN(v)) { err.textContent = `${t.name}: enter a number.`; return; }
      out.push({ testId: r.testId, value: v, qualifier: q ? q[0] : null, text: q ? raw : null });
    }
    const rep = route.report ? { ...route.report } : { id: uid(), createdAt: nowIso(), source: [] };
    Object.assign(rep, { memberId: mid, date, time: form.time.value || null, lab: form.lab.value.trim() || null, notes });
    await S.save('reports', rep);
    const existing = route.report ? S.resultsOf(route.report) : [];
    const keep = [], del = [];
    for (const o of out) {
      const cur = existing.find(x => x.testId === o.testId);
      const t = S.test(o.testId);
      if (cur) {
        if (cur.value !== (o.value ?? null) || (cur.text || null) !== (o.text || null) || cur.memberId !== mid) keep.push({ ...cur, value: o.value ?? null, text: o.text ?? null, qualifier: o.qualifier || null, memberId: mid, calculated: false });
      } else keep.push({ id: uid(), reportId: rep.id, memberId: mid, testId: o.testId, value: o.value ?? null, text: o.text ?? null, qualifier: o.qualifier || null, unit: t.unit || null, calculated: false, source: 'entered', origin: 'app' });
    }
    existing.forEach(x => { if (!out.some(o => o.testId === x.testId)) del.push(x); });
    if (keep.length) await S.save('results', keep);
    if (del.length) await S.remove('results', del);
    toast(route.report ? 'Report updated' : 'Report saved');
    location.hash = '#/r/' + rep.id;
  });
}
